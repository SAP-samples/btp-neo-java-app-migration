_schema-version: "3.2"
ID: ${APP_NAME}
version: 0.0.1
modules:
- name: ${APP_NAME}
  type: java.tomcat
  path: persistence-with-ejb.war
  parameters:
    buildpack: sap_java_buildpack_jakarta
    disk-quota: 512MB
    memory: 512MB
  properties:
    TARGET_RUNTIME: tomee
    ENABLE_SECURITY_JAVA_API_V2: true
    JBP_CONFIG_RESOURCE_CONFIGURATION:
    - tomee/webapps/ROOT/META-INF/context.xml:
        service_name_for_DefaultDB: ${APP_NAME}-hana
    SET_LOGGING_LEVEL: 'ROOT: INFO'
  requires:
    - name: ${APP_NAME}-hana
resources:
  - name: ${APP_NAME}-hana
    type: com.sap.xs.hana-schema
