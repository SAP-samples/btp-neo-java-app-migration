_schema-version: "3.2"
ID: persistence-app
version: 0.0.1
modules:
- name: persistence-app
  type: java.tomcat
  path: target/persistence.war
  parameters:
    buildpack: sap_java_buildpack_jakarta
    disk-quota: 512MB
    memory: 512MB
  properties:
    ENABLE_SECURITY_JAVA_API_V2: true
    JBP_CONFIG_RESOURCE_CONFIGURATION:
    - tomcat/webapps/ROOT/META-INF/context.xml:
        service_name_for_DefaultDB: persistence-app-hana
    SET_LOGGING_LEVEL: 'ROOT: INFO'
  requires:
    - name: persistence-app-hana
resources:
  - name: persistence-app-hana
    type: com.sap.xs.hana-schema
