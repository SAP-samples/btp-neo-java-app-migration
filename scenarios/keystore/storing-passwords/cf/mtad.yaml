ID: pass-storage-app
_schema-version: 3.3.0
version: 0.0.1
modules:
- name: pass-storage-app
  type: java.tomcat
  path: storing-passwords-sample/target/password-storage-sample.war
  parameters:
    buildpack: sap_java_buildpack_jakarta
    disk-quota: 512MB
    memory: 512MB
  properties:
    SET_LOGGING_LEVEL: 'ROOT: INFO'
    ENABLE_SECURITY_JAVA_API_V2: true
  requires:
  - name: credstore-service

resources:
- name: credstore-service
  type: org.cloudfoundry.managed-service
  parameters:
    service: credstore
    service-plan: standard
    config:
      authentication:
        type: mtls