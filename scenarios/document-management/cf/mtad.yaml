_schema-version: "3.2"
version: 0.0.1
ID: document-management-app
modules:
  - name: document-management-app
    type: java.tomcat
    path: target/document-management.war
    parameters:
      buildpack: sap_java_buildpack_jakarta
      disk-quota: 512MB
      memory: 512MB
    properties:
      ENABLE_SECURITY_JAVA_API_V2: true
      SET_LOGGING_LEVEL: 'ROOT: INFO'
    requires:
      - name: document-management-app-sdm

resources:
  - name: document-management-app-sdm
    type: org.cloudfoundry.managed-service
    parameters:
      service: sdm
      service-plan: free