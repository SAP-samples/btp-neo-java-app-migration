_schema-version: "3.2"
ID: connectivity-app
version: 0.0.1
modules:
- name: connectivity-app
  type: java.tomcat
  path: target/connectivity.war
  parameters:
    buildpack: sap_java_buildpack_jakarta
    disk-quota: 512MB
    memory: 512MB
  properties:
    ENABLE_SECURITY_JAVA_API_V2: true
    SET_LOGGING_LEVEL: 'ROOT: INFO'
  requires:
    - name: connectivity-app-destination
    - name: connectivity-app-connectivity
resources:
  - name: connectivity-app-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  - name: connectivity-app-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite