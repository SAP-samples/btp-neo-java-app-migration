_schema-version: "3.2"
ID: ${APP_NAME}
version: 0.0.1
modules:
- name: ${APP_NAME}
  type: java.tomcat
  path: connectivity.war
  parameters:
    buildpack: sap_java_buildpack_jakarta
    disk-quota: 512MB
    memory: 512MB
  properties:
    ENABLE_SECURITY_JAVA_API_V2: true
    SET_LOGGING_LEVEL: 'ROOT: INFO'
  requires:
    - name: ${APP_NAME}-destination
    - name: ${APP_NAME}-connectivity
resources:
  - name: ${APP_NAME}-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  - name: ${APP_NAME}-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite